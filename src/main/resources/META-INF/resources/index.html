<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapple Returns – multi-agent flow</title>
    <style>
        :root {
            --bg: #f2f2f5;
            --panel: #ffffff;
            --border: #e3e3e8;
            --text: #1d1d1f;
            --muted: #86868b;
            --accent: #0071e3;
            --green: #1d7a3a;
            --green-bg: #e6f7eb;
            --red: #b42318;
            --red-bg: #fdecec;
            --amber: #8a5a00;
            --amber-bg: #fff4dd;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 16px 24px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .brand { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
        .tagline { font-size: 13px; color: var(--muted); }

        main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 18px;
            padding: 18px;
        }

        aside, .panel {
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .right {
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1.15fr);
            gap: 18px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f2;
            flex-shrink: 0;
        }

        .panel-head h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .muted { color: var(--muted); font-size: 12px; }

        .case-list {
            padding: 12px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .case-tile {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fafafa;
            color: var(--text);
            text-align: left;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
        }

        .case-tile:hover { border-color: #b9b9c0; }
        .case-tile:active { transform: scale(0.995); }

        .case-tile.selected {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        .case-text-block {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .case-avatar {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
        }

        .case-avatar svg, .avatar svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .avatar {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            background: #f0f0f2;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
        }

        .case-heading {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .case-tile .case-title { font-size: 14px; font-weight: 600; }
        .case-tile .case-id {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            color: var(--muted);
        }
        .case-tile.selected .case-id { color: #a1a1a6; }

        .case-text {
            margin: 0;
            padding: 18px 20px;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            color: #3a3a3c;
        }

        .run-button {
            border: 0;
            border-radius: 999px;
            padding: 9px 18px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
        }

        .run-button:disabled { background: #c7c7cc; cursor: not-allowed; }

        .agents {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f2;
            flex-shrink: 0;
        }

        .agent {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #fafafa;
            color: #6e6e73;
            font-size: 13px;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .agent .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #c7c7cc;
            flex-shrink: 0;
        }

        .agent .agent-state { font-size: 11px; color: var(--muted); text-transform: lowercase; }
        .agent .agent-emoji { font-size: 15px; line-height: 1; }

        .agent.running {
            border-color: #f0b429;
            background: #fff8e6;
            color: var(--amber);
        }
        .agent.running .dot { background: #f0b429; animation: pulse 1s ease-in-out infinite; }
        .agent.running .agent-state { color: var(--amber); }

        .agent.done {
            border-color: #b7e1c1;
            background: #f0fbf3;
            color: var(--green);
        }
        .agent.done .dot { background: #2eae55; }
        .agent.done .agent-state { color: var(--green); }

        .agent.error {
            border-color: #f5b5b0;
            background: var(--red-bg);
            color: var(--red);
        }
        .agent.error .dot { background: var(--red); }
        .agent.error .agent-state { color: var(--red); }

        .agent.current { box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.18); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.68); }
        }

        .badge {
            padding: 6px 12px;
            border-radius: 999px;
            background: #ececf0;
            color: #6e6e73;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .badge.running, .badge.queued { background: #e8f0fe; color: #1a56db; }
        .badge.accepted { background: var(--green-bg); color: var(--green); }
        .badge.rejected { background: var(--red-bg); color: var(--red); }
        .badge.information-missing { background: var(--amber-bg); color: var(--amber); }
        .badge.error { background: var(--red-bg); color: var(--red); }

        .result-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .result-meta strong { color: #3a3a3c; font-weight: 600; }

        .result-text {
            flex: 1;
            min-height: 120px;
            margin: 0;
            padding: 16px;
            border: 1px solid #ededf0;
            border-radius: 12px;
            background: #fafafa;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            color: #3a3a3c;
            overflow: auto;
        }

        .empty { color: var(--muted); }

        @media (max-width: 860px) {
            main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
            aside { max-height: 220px; }
            .right { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
        }
    </style>
</head>
<body>
<header>
    <div class="brand">Mapple Returns</div>
    <div class="tagline">intake → guarantee → output</div>
</header>

<main>
    <aside>
        <div class="panel-head">
            <h2>Test cases</h2>
            <span id="case-count" class="muted"></span>
        </div>
        <div id="case-list" class="case-list"></div>
    </aside>

    <section class="right">
        <div class="panel">
            <div class="panel-head">
                <div class="case-heading">
                    <div id="case-avatar" class="avatar" aria-hidden="true"></div>
                    <div>
                        <h2 id="case-title">Select a test case</h2>
                        <div id="case-subtitle" class="muted">Choose a case on the left</div>
                    </div>
                </div>
                <button id="run-button" class="run-button" type="button" disabled>Run flow</button>
            </div>
            <pre id="case-content" class="case-text empty">Pick a case on the left to see the customer request.</pre>
        </div>

        <div class="panel">
            <div class="panel-head">
                <h2>Result</h2>
                <span id="status-badge" class="badge">IDLE</span>
            </div>
            <div id="agents" class="agents"></div>
            <div class="result-body">
                <div id="result-meta" class="result-meta"></div>
                <div id="result-text" class="result-text empty">Run the flow to see the output agent's reply.</div>
            </div>
        </div>
    </section>
</main>

<script src="/mapple.js"></script>
</body>
</html>
