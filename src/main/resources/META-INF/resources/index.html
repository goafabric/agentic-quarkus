<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agentic Chat</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body { background: #f4f6f9; }
        #chat-box {
            height: 500px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
        .msg-user { align-self: flex-end; background: #0d6efd; color: #fff; border-bottom-right-radius: 4px; }
        .msg-agent { align-self: flex-start; background: #e9ecef; color: #212529; border-bottom-left-radius: 4px; }
        .msg-thinking { align-self: flex-start; background: #e9ecef; color: #6c757d; font-style: italic; border-bottom-left-radius: 4px; }
        #input-row { margin-top: 12px; }
        #send-btn { min-width: 80px; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 800px;">
    <h4 class="mb-3">Agentic Chat</h4>
    <div id="chat-box"></div>
    <div class="input-group" id="input-row">
        <input id="user-input" type="text" class="form-control" placeholder="Type a message..." autofocus>
        <button id="send-btn" class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
    <div class="mt-3 text-muted small">
        <a href="q/swagger-ui" class="me-3">Swagger UI</a>
        <a href="q/dev-ui" class="me-3">Dev UI</a>
        <a href="actuator/health">Health</a>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    userInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, cssClass) {
        const div = document.createElement('div');
        div.className = 'msg ' + cssClass;
        div.innerText = text;
        chatBox.appendChild(div);
        scrollToBottom();
        return div;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        userInput.value = '';
        sendBtn.disabled = true;
        userInput.disabled = true;

        appendMessage(message, 'msg-user');
        const thinking = appendMessage('...', 'msg-thinking');

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            if (!response.ok) {
                const err = await response.text();
                thinking.className = 'msg msg-agent';
                thinking.innerText = 'Error: ' + (err || response.statusText);
            } else {
                const data = await response.json();
                thinking.className = 'msg msg-agent';
                thinking.innerText = data.reply;
            }
            scrollToBottom();
        } catch (e) {
            thinking.className = 'msg msg-agent';
            thinking.innerText = 'Network error: ' + e.message;
        } finally {
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }
    }
</script>
</body>
</html>
