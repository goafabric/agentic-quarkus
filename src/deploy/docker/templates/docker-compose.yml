services:
  application:
    container_name: ${_Values_root_name}-application
    image:  ${_Values_image_repository}:${_Values_image_tag}
    restart: 'no'
    ports:
      - "${_Values_service_port}:${_Values_service_port}"
    command: ["-Xmx${_Values_resources_requests_memory}"]

    healthcheck:
      test: "curl -f http://localhost:${_Values_service_port}/actuator/health || exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - tmp:/tmp
      - applogs:/usr/share/logs
    networks:
      - ${_Values_root_name}-net
    environment:
      #application
      TZ: Europe/Berlin
      quarkus.http.port: "${_Values_service_port}"
      quarkus.http.io-threads: "20"

      #tracing
      quarkus.otel.exporter.otlp.traces.endpoint: "http://${_Values_host_docker_internal}:4317"
      quarkus.application.name: "agentic.quarkus"

      #langchain
      ANTHROPIC_FOUNDRY_API_KEY: ${ANTHROPIC_FOUNDRY_API_KEY}
      ANTHROPIC_FOUNDRY_RESOURCE: ${ANTHROPIC_FOUNDRY_RESOURCE}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL}

      #mcp
      quarkus.langchain4j.mcp.callee.url: "http://${_Values_host_docker_internal}:50900/mcp"
      quarkus.langchain4j.mcp.person.url: "http://${_Values_host_docker_internal}:50800/mcp"


      #log levels
      QUARKUS_LOG_LEVEL: "INFO"
      QUARKUS_LOG_CATEGORY__ORG_GOAFABRIC__LEVEL: "INFO"
      QUARKUS_LOG_CATEGORY__ORG_FLYWAYDB_CORE__LEVEL: "INFO"
      QUARKUS_LOG_CATEGORY__ORG_HIBERNATE__LEVEL: "INFO"

  person-service:
    container_name: ${_Values_root_name}-person-service-application
    image:  goafabric/person-service-quarkus:3.32.2
    restart: 'no'
    ports:
      - "50800:50800"

    healthcheck:
      test: "curl -f http://localhost:${_Values_service_port}/actuator/health || exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - tmp:/tmp
      - applogs:/usr/share/logs
      - ./secrets:/mnt/secrets
    networks:
      - ${_Values_root_name}-net
    environment:
      #application
      TZ: Europe/Berlin
      quarkus.http.port: "50800"
      quarkus.http.io-threads: "20"

      #tracing
      quarkus.otel.exporter.otlp.traces.endpoint: "http://${_Values_host_docker_internal}:4317"
      quarkus.application.name: "person-service"

      #persistence
      quarkus.datasource.jdbc.url: "jdbc:postgresql://${_Values_host_docker_internal}:5432/person"
      quarkus.datasource.jdbc.max-size: "10"

      database.provisioning.goals: "-migrate -import-demo-data"

      #adapter
      adapter.calleeservice.url: "http://${_Values_host_docker_internal}:50900"
      adapter.timeout: "10000"
      adapter.circuitBreaker.enabled: "true"

      #kafka
      mp.messaging.outgoing.general.enabled: "false"

      #azure blob
      quarkus.azure.storage.blob.enabled: "false"
      #secrets
      quarkus.datasource.username: person-service
      quarkus.datasource.password: person-service

      #log levels
      QUARKUS_LOG_LEVEL: "INFO"
      QUARKUS_LOG_CATEGORY__ORG_GOAFABRIC__LEVEL: "INFO"
      QUARKUS_LOG_CATEGORY__ORG_FLYWAYDB_CORE__LEVEL: "INFO"
      QUARKUS_LOG_CATEGORY__ORG_HIBERNATE__LEVEL: "INFO"


    depends_on:
      postgres:
        condition: service_started

  callee-service:
    container_name: ${_Values_root_name}-callee-service-application
    image: goafabric/callee-service-quarkus:3.35.4
    restart: 'no'
    ports:
      - "50900:50900"

    healthcheck:
      test: "curl -f http://localhost:${_Values_service_port}/actuator/health || exit 1"
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - tmp:/tmp
      - applogs:/usr/share/logs
    networks:
      - ${_Values_root_name}-net
    environment:
      #application
      TZ: "Europe/Berlin"
      quarkus.http.port: "50900"
      quarkus.http.io-threads: "20"

      #tracing
      quarkus.otel.exporter.otlp.traces.endpoint: "http://host.docker.internal:4317"
      quarkus.application.name: "callee-service"

      #log levels
      quarkus.log.level: "INFO"
      quarkus.log.category."org.goafabric".level: "INFO"
      quarkus.log.category."org.flywaydb.core".level: "INFO"
      quarkus.log.category."org.hibernate".level: "INFO"


  postgres:
    container_name: ${_Values_root_name}-postgres
    image: postgres:18.3
    restart: 'no'
    ports:
      - 5432:5432
    environment:
      TZ: "Europe/Berlin"
      #secrets
      POSTGRES_USER: "person-service"
      POSTGRES_PASSWORD: "person-service"
      POSTGRES_DB: "person"

    command: postgres -c 'shared_buffers=64MB' -c 'max_connections=30' -c 'shared_preload_libraries=pg_stat_statements'
    healthcheck:
      test: "sh -c pg_isready"
      interval: 2s
      timeout: 5s
      retries: 5
#    volumes:
#      - pgdata_quarkus:/var/lib/postgresql/data
    networks:
      - ${_Values_root_name}-net


volumes:
    tmp:
    applogs:
    pgdata_quarkus:

networks:
  agentic-quarkus-net:
    driver: bridge